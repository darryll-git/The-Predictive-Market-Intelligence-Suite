name: Run Healthcare Analytics Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true # Fast binary package caching
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R Packages
        run: |
          Rscript -e 'install.packages(c("dplyr", "tidyr", "lubridate", "ggplot2", "plotly", "DT", "shinyWidgets", "bslib", "quantmod", "zoo", "tseries", "tidymodels", "glmnet", "vip", "rsconnect"))'
          
      - name: Run Pipeline Scripts
        run: |
          Rscript scripts/01_data_ingestion.R
          Rscript scripts/02_data_cleaning.R
          Rscript scripts/03_eda_statistics.R
          Rscript scripts/04_feature_eng.R
          Rscript scripts/05_model_training.R
          
      - name: Commit and Push Artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/raw/
          git add -f data/processed/
          git add -f dashboard/app_data/
          git add -f outputs/
          git diff-index --quiet HEAD || git commit -m "Auto-update market intelligence data, plots, and predictive model [skip ci]"
          git pull --rebase
          git push

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript deploy_cloud.R
